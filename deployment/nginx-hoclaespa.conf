server {
    server_name hoclaespa.com www.hoclaespa.com 2.25.130.246 _;

    root /var/www/ministerial-command-center;
    index index.html;

    # Document uploads are capped at 50MB by the API; nginx must not reject
    # them first with a 413.
    client_max_body_size 50M;

    # Never serve the API's working directories as static files.
    location ^~ /backend/ { deny all; return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ^~ /uploads/multimedia/frames/ {
        alias /var/www/ministerial-command-center/backend/uploads/multimedia/frames/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ^~ /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hoclaespa.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hoclaespa.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.hoclaespa.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = hoclaespa.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name hoclaespa.com www.hoclaespa.com 2.25.130.246 _;
    return 404; # managed by Certbot




}