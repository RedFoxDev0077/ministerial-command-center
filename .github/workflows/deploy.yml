name: CI/CD — Build & Deploy

# Pushing to master builds both apps and deploys them to the production VPS.
# Connection details come from repository secrets (see docs/CI_CD_SETUP.md):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY  (required)
#   VPS_PORT, VPS_SSH_KNOWN_HOSTS    (optional)
on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      apply_search_migration:
        description: 'Apply prisma/sql/001_document_search_vector.sql (idempotent, safe)'
        type: boolean
        default: false
      apply_schema_push:
        description: 'Run `prisma db push` — CAN DROP COLUMNS AND DATA. Take a backup first.'
        type: boolean
        default: false

# Never let two deploys touch the server at once, and never cancel a deploy
# midway — a half-applied release is worse than a slow one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  # nginx serves the SPA at / and proxies /api -> localhost:3000, so the
  # frontend talks to a relative path in production.
  VITE_API_URL: ${{ vars.VITE_API_URL || '/api' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      # ---------------- Frontend ----------------
      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend (informational)
        id: fe_types
        continue-on-error: true
        run: |
          # The frontend has pre-existing type errors and `strict` is off, so this
          # reports but does not block. Vite builds regardless (esbuild strips
          # types without checking them).
          npx tsc --noEmit -p tsconfig.app.json 2>&1 | tee fe-types.log || true
          echo "count=$(grep -c 'error TS' fe-types.log || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        run: npm run build

      # ---------------- Backend ----------------
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Typecheck backend
        # The backend is type-clean; keep it that way. This one blocks.
        working-directory: backend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Stage deployment artifacts
        run: |
          set -euo pipefail
          mkdir -p artifact/frontend artifact/backend
          cp -r dist/.                        artifact/frontend/
          cp -r backend/dist                  artifact/backend/dist
          cp -r backend/prisma                artifact/backend/prisma
          cp    backend/package.json          artifact/backend/
          cp    backend/package-lock.json     artifact/backend/
          # node_modules is deliberately NOT shipped: bcrypt, sharp and
          # ffmpeg-static are native and must be built on the target host.

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: artifact/
          retention-days: 14

      - name: Build summary
        run: |
          {
            echo "### Build"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Frontend build | ✅ passed |"
            echo "| Backend typecheck | ✅ passed |"
            echo "| Backend build | ✅ passed |"
            echo "| Frontend typecheck | ⚠️ ${{ steps.fe_types.outputs.count }} pre-existing errors (non-blocking) |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-22.04
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: artifact

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ] || [ -z "${VPS_HOST:-}" ]; then
            echo "::error::VPS_SSH_KEY and VPS_HOST secrets must be set. See docs/CI_CD_SETUP.md"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [ -n "${KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Trust-on-first-use. Set VPS_SSH_KNOWN_HOSTS to pin the host key and
            # remove the (small) MITM window on the first connection.
            echo "::warning::VPS_SSH_KNOWN_HOSTS not set — falling back to ssh-keyscan (trust on first use)."
            ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Verify connectivity
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" 'echo "connected to $(hostname)"'

      - name: Back up current release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          APP=/var/www/ministerial-command-center
          # Single rolling backup: enough to roll back one bad deploy without
          # slowly filling a 50GB disk with release history.
          rm -rf "$APP/.backup"
          mkdir -p "$APP/.backup"
          [ -d "$APP/backend/dist" ] && cp -r "$APP/backend/dist" "$APP/.backup/backend-dist" || true
          find "$APP" -maxdepth 1 -mindepth 1 \
               ! -name backend ! -name .backup ! -name uploads \
               -exec cp -r {} "$APP/.backup/" \; 2>/dev/null || true
          echo "backup written to $APP/.backup"
          REMOTE

      - name: Upload frontend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          # --delete removes stale hashed assets, but backend/, uploads/ and the
          # backup live under this same root — excluding them is load-bearing.
          rsync -az --delete \
            --exclude '/backend/' \
            --exclude '/uploads/' \
            --exclude '/.backup/' \
            -e "ssh -i ~/.ssh/deploy_key -p $VPS_PORT" \
            artifact/frontend/ "$VPS_USER@$VPS_HOST:/var/www/ministerial-command-center/"

      - name: Upload backend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          # No --delete here: .env, uploads/ and node_modules/ live in this
          # directory and must survive the deploy.
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -p $VPS_PORT" \
            artifact/backend/ "$VPS_USER@$VPS_HOST:/var/www/ministerial-command-center/backend/"

      - name: Install dependencies, migrate and restart
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          APPLY_SEARCH: ${{ inputs.apply_search_migration }}
          APPLY_PUSH: ${{ inputs.apply_schema_push }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            APPLY_SEARCH="${APPLY_SEARCH:-false}" APPLY_PUSH="${APPLY_PUSH:-false}" bash -s <<'REMOTE'
          set -euo pipefail
          cd /var/www/ministerial-command-center/backend

          if [ ! -f .env ]; then
            echo "::error::backend/.env is missing on the server. The API cannot start without it."
            exit 1
          fi

          echo "--- installing production dependencies ---"
          npm ci --omit=dev

          echo "--- generating Prisma client ---"
          # `prisma` is a devDependency and we installed prod-only, so fetch the
          # pinned CLI on demand rather than shipping the whole dev tree.
          npx --yes prisma@5 generate

          if [ "$APPLY_PUSH" = "true" ]; then
            echo "--- applying schema changes (prisma db push) ---"
            npx --yes prisma@5 db push --skip-generate
          fi

          if [ "$APPLY_SEARCH" = "true" ]; then
            echo "--- applying full-text search migration ---"
            set -a; . ./.env; set +a
            psql "$DATABASE_URL" -f prisma/sql/001_document_search_vector.sql
          fi

          echo "--- restarting API ---"
          if pm2 describe ministerial-api > /dev/null 2>&1; then
            pm2 reload ministerial-api --update-env
          else
            # Note: scripts/deploy-backend.sh references ecosystem.config.js,
            # which does not exist in the repo. Start from dist/main.js instead.
            pm2 start dist/main.js --name ministerial-api
          fi
          pm2 save
          REMOTE

      - name: Health check
        id: health
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          # The API validates its environment and exits on a bad config, so give
          # it a moment and treat a non-200 as a failed release.
          for i in $(seq 1 15); do
            if curl -fsS --max-time 5 http://localhost:3000/api/health > /tmp/health.json 2>/dev/null; then
              echo "healthy: $(cat /tmp/health.json)"
              exit 0
            fi
            sleep 2
          done
          echo "health check failed after 30s"
          pm2 logs ministerial-api --lines 40 --nostream || true
          exit 1
          REMOTE

      - name: Roll back on failed health check
        if: failure() && steps.health.outcome == 'failure'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          APP=/var/www/ministerial-command-center
          if [ -d "$APP/.backup/backend-dist" ]; then
            echo "restoring previous backend build"
            rm -rf "$APP/backend/dist"
            cp -r "$APP/.backup/backend-dist" "$APP/backend/dist"
            pm2 reload ministerial-api --update-env || pm2 start "$APP/backend/dist/main.js" --name ministerial-api
            echo "rolled back"
          else
            echo "no backup available to roll back to"
          fi
          REMOTE
          echo "::error::Deploy failed health check and was rolled back."

      - name: Deployment summary
        if: always()
        env:
          # Passed as environment variables, never interpolated into the script
          # body: a commit message is attacker-controlled text, and `${{ }}` in a
          # run block is substituted before bash sees it — that is a shell
          # injection vector.
          STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          SCHEMA_PUSH: ${{ inputs.apply_schema_push || false }}
          SEARCH_MIGRATION: ${{ inputs.apply_search_migration || false }}
        run: |
          if [ "$STATUS" = "success" ]; then
            RESULT="✅ deployed"
          else
            RESULT="❌ failed (rolled back)"
          fi
          # Keep the table to one line and strip pipes so the message cannot
          # break the markdown table.
          MSG=$(printf '%s' "${COMMIT_MSG:-manual run}" | head -1 | tr '|' '/')
          {
            echo "### Deployment"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Status | $RESULT |"
            echo "| Commit | \`$COMMIT_SHA\` |"
            echo "| Message | $MSG |"
            echo "| Author | $ACTOR |"
            echo "| Schema push | $SCHEMA_PUSH |"
            echo "| Search migration | $SEARCH_MIGRATION |"
          } >> "$GITHUB_STEP_SUMMARY"
