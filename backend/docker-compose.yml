version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ministerial-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ministerial_command_center}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ministerial-network

  backend:
    build: .
    container_name: ministerial-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      # All secrets come from a gitignored .env next to this file. Compose fails
      # fast if one is missing, so a deployment can never silently come up with
      # a placeholder signing key.
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ministerial_command_center}?schema=public"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 64)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env (openssl rand -hex 64)}
      JWT_EXPIRATION: "15m"
      JWT_REFRESH_EXPIRATION: "7d"
      NODE_ENV: "development"
      PORT: 3000
      CORS_ORIGIN: "http://localhost:5173,http://localhost:3000"
    ports:
      - "3000:3000"
    networks:
      - ministerial-network

volumes:
  postgres_data:

networks:
  ministerial-network:
    driver: bridge
